[package]
name = "app"
version = "0.1.0"
edition = "2021"

# `harness = false` is what makes this target's `fn main` the entry point
# rather than a `#[test]` function: the target split has to answer for it, and
# the attribute split cannot.
[[test]]
name = "it"
path = "tests/it.rs"
harness = false

# Declared so that `#[cfg(all(test, feature = "extra"))]` is a gate that *can*
# hold: an undeclared feature can hold in no build at all, which is a different
# question and a different answer.
[features]
extra = []
