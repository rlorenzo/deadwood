# Test fixture: dependencies declared in the wrong table. Every entry here is
# named by some code, so nothing in this fixture is an *unused* dependency —
# the only question it asks is which table each entry belongs in.
#
# The dependencies do not exist on any registry, and do not need to:
# `cargo metadata --no-deps` never resolves them, and Deadwood never builds.
[package]
name = "depkinds"
version = "0.1.0"
edition = "2021"

[dependencies]
# Named by the library and by the integration test, which is what a normal
# dependency is for. Not a finding.
shared_crate = "1"
# Named only by `tests/it.rs`. Test targets link `[dev-dependencies]`, so this
# entry costs every consumer of the crate a build for nothing: a finding.
test_only_crate = "1"
# Named only by `examples/demo.rs`. Examples link `[dev-dependencies]` too, so
# this is the same finding through a different target kind.
example_only_crate = "1"
# The library names it, so the entry is right where it is — the stale
# `[build-dependencies]` copy below is the finding.
stale_build_crate = "1"
# Named only by `src/outline_tests.rs`, which is the body of a `#[cfg(test)]
# mod` whose gate is written in `src/lib.rs`. Test code that happens to live in
# its own file is still test code: the same finding as `test_only_crate`, in
# the form the file itself gives no sign of.
outline_test_crate = "1"
# Named by `src/shared_view.rs`, which three declarations reach — one of them
# ungated. The library genuinely uses it, so reporting this entry would be a
# false positive rather than a missed finding.
shared_view_crate = "1"
# Named a level further down, by `src/shared_view/deeper.rs`. Its own
# declaration is ungated and says nothing; what it inherits decides.
shared_view_child_crate = "1"
# Renamed to `aliased_crate` at the crate root, which is the only reason a
# mention of that name in `src/` belongs to this entry rather than to the
# dev-dependency spelled the same way.
renamed_core_crate = "1"
# The same rename through `use ... as ...`, the edition-2018 spelling.
use_renamed_crate = "1"
# Aliased to `nested_alias_crate` inside a nested `mod`, which binds only in
# that module. Folding it wider would move this entry's mentions elsewhere.
nested_renamed_crate = "1"
# Named at the crate root, where the nested alias above does not reach. If a
# nested alias were applied to the whole file this entry would look unused —
# a finding invented against code that compiles.
nested_alias_crate = "1"
# An `extern crate ... as ...` inside a nested `mod` binds there and nowhere
# else, exactly as the `use` spelling does. This pair pins the depth check for
# that form: without it the crate-root mention below is folded away.
nested_extern_renamed = "1"
nested_extern_alias = "1"
# A `use` rename at the crate root binds in the root module only — it does not
# reach a submodule file, which sees the crate itself through the extern
# prelude. This pair pins that: `crossfile_alias_crate` is named only by
# `src/crossfile.rs`, so folding the root's rename across the target reports it
# unused.
crossfile_renamed_crate = "1"
crossfile_alias_crate = "1"
# An `extern crate ... as ...` at the top of `src/crossfile.rs`, which is a
# module file and not the crate root — so it does not enter the extern prelude
# and binds no wider than a `use` would. `modfile_alias_crate` is named at the
# crate root, where that rename does not reach.
modfile_renamed_crate = "1"
modfile_alias_crate = "1"
# Named only from a bare `#[test] fn` at module scope in `src/lib.rs`. No
# `#[cfg(test)]` is written anywhere near it, and it does not need one:
# `#[test]` is itself what keeps the function out of every build a consumer
# gets, so this entry belongs in `[dev-dependencies]` — a finding.
test_fn_crate = "1"
# The same through `#[bench]`, which confines a function identically (`cargo
# bench` is no more a consumer of the crate than `cargo test` is).
bench_fn_crate = "1"
# Named only from a function carrying `#[should_panic]` and no `#[test]`. That
# attribute confines nothing on its own — rustc compiles the function into the
# library — so this entry is right where it is: not a finding.
should_panic_crate = "1"
# Named only from a function carrying `#[harness::test]`, an attribute macro
# Deadwood cannot expand. Guessing from the name of one is a guess in both
# directions, so the mention stays library code and the entry stays put: not a
# finding.
proc_macro_test_crate = "1"
# Named only from a bare `#[test] fn` *inside* the `#[cfg(test)] mod tests`
# below. The module already moves its whole subtree into the tests, so this
# entry is reported exactly as it was before `#[test]` counted for anything —
# which is what makes it the regression guard for the nested case.
nested_test_fn_crate = "1"

[dev-dependencies]
# Named only by a `#[cfg(test)]` module inside the library. That module is part
# of the lib target and still links `[dev-dependencies]`, so calling this
# misplaced would be the single largest false positive this check could make.
cfg_test_crate = "1"
# Named only by a doc example in `src/lib.rs`. A doctest compiles with the
# dev-dependencies available, so the entry is correctly placed.
doc_only_crate = "1"
# Named only from a bare `#[test] fn` at module scope — the shape
# `clap_builder` names `static_assertions` from, and `winnow`
# `term-transcript`. The manifest is correct, and this is the entry the check
# has to stay silent about: reporting it would tell a package its manifest is
# broken when it compiles.
test_fn_dev_crate = "1"
# Named by ordinary library code. A library build does not link
# `[dev-dependencies]` at all, so this manifest does not compile: the entry
# belongs one table up. This is the claim phase 5 refused and phase 21 makes.
library_named_dev_crate = "1"
# Named by the library *and* by `tests/it.rs`. This is where the two directions
# stop being mirror images: an entry every mention of which is dev code belongs
# in `[dev-dependencies]`, but one runtime mention is enough to put an entry
# here in `[dependencies]`, however much test code names it too — the library
# cannot link it either way. A finding.
library_and_test_dev_crate = "1"
# Named only from inside a `macro_rules!` body, which Deadwood does not expand.
# A mention it cannot attribute to a target keeps the entry alive for the
# unused check and proves nothing about placement: not a finding, in either
# direction.
opaque_dev_crate = "1"
# Named only by `build.rs`. A build script links `[build-dependencies]`, not
# `[dev-dependencies]`, so this entry is in the wrong table — but the table it
# belongs in is the build one, and this check makes no claim from build-script
# evidence about a dev entry. Not a finding, deliberately.
build_only_dev_crate = "1"
# Named by library code *and* by a doc comment. One opaque mention anywhere
# stops the check judging an entry at all, so this is not a finding — even
# though the library mention on its own would be enough. That costs a finding
# rather than inventing one, and it is the same rule in both directions; it is
# pinned here because the guard is otherwise invisible from the outside.
doc_and_library_dev_crate = "1"
# The `serde_json` shape. `src/lib.rs` renames `renamed_core_crate` to this
# name, so every `aliased_crate::` in the library means that crate and not this
# one — while `tests/it.rs`, a separate crate the rename does not reach, names
# this one for real. Reporting it in either direction would be a finding
# invented against a manifest that compiles.
aliased_crate = "1"
# The dev-dependency the `use` rename above shadows, and the same pair of
# answers as `aliased_crate`: no library mention belongs to it, and
# `tests/it.rs` — a separate crate the rename does not reach — names it for
# real. Not a finding in either direction.
use_aliased_crate = "1"

[build-dependencies]
# Named by `build.rs`, the only target that can use a build-dependency.
build_crate = "1"
# Named only from a `#[test] fn` inside `build.rs`. A test attribute does not
# turn build-script code into dev code — there is no test harness for a build
# script — so this entry is right where it is: not a finding.
build_test_crate = "1"
# Never named by the build script; the library names it. The `[dependencies]`
# entry above is the one carrying the library's use, so this copy is a stale
# leftover in a table nothing reads: a finding.
stale_build_crate = "1"

[workspace]
