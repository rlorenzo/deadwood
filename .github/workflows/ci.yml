name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stated rather than inherited. Without this block the job runs with whatever
# the repository's default workflow permissions happen to be — a setting that
# lives outside this file and can be widened to read/write without any change
# here. Nothing below writes to the repository: it checks out, builds, and
# reports, so read access to the contents is the whole need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The action in `action.yml` is exercised exactly as a consumer would use
  # it — runner-provided stable Rust, no setup steps — against this
  # repository, which analyzes clean. A broken action fails here before it
  # fails in someone else's CI.
  action:
    name: action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./

  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned by SHA, so the toolchain must be named explicitly (the action
      # normally infers it from the ref).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Only the broken-link lint is denied: the module docs deliberately link
      # to crate-private items, which rustdoc also warns about.
      - name: Doc links
        run: cargo doc --no-deps --document-private-items --quiet
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
      - name: Test
        run: cargo test --all-targets

  # Supply-chain gate: RUSTSEC advisories, the license allowlist, duplicate
  # versions and registry sources, per deny.toml. Socket reviews what a PR
  # changes; this checks what the lockfile already holds, on every run, so
  # an advisory published between PRs is caught by the next one.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Mutation testing on the changed code only: cargo-mutants rewrites each
  # changed function in turn and expects some test to notice. A surviving
  # mutant is a recall gap the review's hand-picked inversions missed — the
  # automated form of the "recall by mutation" record every slice writes.
  # Informational while its noise level is being learned: the job reports,
  # the merge does not wait on it. The full crate holds ~960 mutants, which
  # is why this runs on the diff, not the tree.
  mutants:
    name: mutants (changed code, informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      # Full history: the three-dot diff below needs the merge base with the
      # PR's target, which a depth-1 clone does not hold.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-mutants
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Mutants in diff
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          git diff FETCH_HEAD...HEAD > pr.diff
          cargo mutants --in-diff pr.diff
