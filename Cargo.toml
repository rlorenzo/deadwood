[package]
name = "deadwood"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Codebase health analyzer for Rust workspaces: dead module files and unused public items"
license = "MIT"
repository = "https://github.com/rlorenzo/deadwood"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
