[package]
# `deadwood` on crates.io is an unrelated project, so the *package* is named
# `deadwood-rs`; the library crate and the installed binary stay `deadwood`,
# which is the name every doc and usage example is written against.
name = "deadwood-rs"
version = "1.0.0-beta.1"
edition = "2024"
rust-version = "1.94"
description = "Codebase health analyzer for Rust workspaces: dead module files and unused public items"
license = "MIT"
repository = "https://github.com/rlorenzo/deadwood"
readme = "README.md"
keywords = ["dead-code", "unused", "lint", "cargo", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]
# The packaged crate ships the tool, not the project. The fixture packages the
# integration tests analyze are cut by `cargo package` regardless (each holds
# its own Cargo.toml), which would ship `tests/analyze.rs` with nothing to
# read — so the tests stay out, along with CI and the phase-history docs.
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[lib]
name = "deadwood"
path = "src/lib.rs"

[[bin]]
name = "deadwood"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
# Parsing only: Deadwood reads `deadwood.toml` and never writes TOML, so the
# serializer and its formatting machinery stay out of the build.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
